# Claude Code on GitHub: comment "@claude ..." on an issue or PR to have
# Claude implement it (or fix review feedback) and push a branch / PR.
# Auth uses the repo owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token`), not API billing. Only users with write access can
# trigger it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run at a time: keeps subscription usage predictable and stops two runs
# from editing the same files.
concurrency:
  group: claude
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installed up front so Claude can run the checks without spending turns on setup.
      - name: Install dependencies
        run: npm ci

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sonnet for coding (the planning was done up front with a stronger
          # model). The turn cap is a safety net against runaway runs; comment
          # "@claude continue" to resume a run that hits it.
          claude_args: >-
            --model sonnet
            --max-turns 80
            --allowedTools "Bash(npm run check),Bash(npm test),Bash(npm run typecheck),Bash(npm run build),Bash(npx vitest:*),Bash(npx tsc:*)"
